<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Evorium Pool</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#43382d,#151311 70%);color:#eee;font:16px system-ui;text-align:center}main{max-width:1000px;margin:auto;padding:18px}h1{letter-spacing:5px;font-size:22px;margin:0;color:#e7cc91}p{color:#c4b9a4}canvas#table{width:100%;aspect-ratio:2/1;display:block;touch-action:none;box-shadow:0 18px 40px #000;border-radius:20px}section{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px;margin-top:22px}button{background:#d3b477;color:#21190f;border:0;border-radius:7px;padding:12px 24px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input{accent-color:#d3b477}#spin{width:90px;height:90px;touch-action:none;cursor:crosshair}small{display:block;color:#bdb2a1}#status{min-height:24px}</style><meta name="viewport" content="width=device-width,initial-scale=1">
<style>#table{max-width:min(100%,140dvh);margin-inline:auto}</style>
</head><body><main><h1>EVORIUM · THE CROOKED BILLET</h1><p>British pub pool · Practice table</p><canvas id=table width=1000 height=500></canvas><section><div><small>Cue power</small><input id=power type=range min=5 max=100 value=55><span id=pval>55%</span></div><div><small>Spin / English</small><canvas id=spin width=90 height=90></canvas><small>Tap to set spin</small></div><button id=shoot>SHOOT</button><button id=reset>New rack</button></section><p id=status></p><small>Move or tap on the table to aim. Adjust power and spin, then shoot (or press Space). Pot all reds and yellows before the black.</small></main><script>
const c=document.querySelector('#table'),g=c.getContext('2d'),s=document.querySelector('#spin'),sg=s.getContext('2d'),power=document.querySelector('#power'),shoot=document.querySelector('#shoot'),status=document.querySelector('#status');let balls=[],aim=0,spinX=0,spinY=0,shots=0,potted=0,rolling=false,finished=false,scratch=false;const R=11,L=56,T=56,W=888,H=388, pockets=[[L,T],[500,T],[L+W,T],[L,T+H],[500,T+H],[L+W,T+H]];const colors={red:'#b92323',yellow:'#e9b92b',black:'#151515',white:'#f6f1df'};function ball(x,y,k){return{x,y,k,vx:0,vy:0,dead:false,side:0,follow:0}}function rack(){balls=[ball(270,250,'white')];let ks=['red','yellow','red','yellow','black','yellow','red','yellow','red','yellow','red','yellow','red','yellow','red'],i=0;for(let j=0;j<5;j++)for(let k=0;k<=j;k++)balls.push(ball(680+j*(R*1.76+1),250+(k-j/2)*(2*R+1),ks[i++]));shots=potted=0;rolling=finished=scratch=false;aim=0;spinX=spinY=0;drawSpin();update()}function update(){status.textContent=finished?'Rack complete or black potted early — select New rack.':`Shots: ${shots}  ·  Colours potted: ${potted}/14${scratch?'  ·  Scratch: cue ball respotted':''}`;shoot.disabled=rolling||finished}function drawSpin(){sg.clearRect(0,0,90,90);let gr=sg.createRadialGradient(32,25,2,45,45,39);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#aaa394');sg.fillStyle=gr;sg.beginPath();sg.arc(45,45,39,0,Math.PI*2);sg.fill();sg.strokeStyle='#777';sg.beginPath();sg.moveTo(10,45);sg.lineTo(80,45);sg.moveTo(45,10);sg.lineTo(45,80);sg.stroke();sg.fillStyle='#b62b28';sg.beginPath();sg.arc(45+spinX*30,45-spinY*30,5,0,7);sg.fill()}s.onpointerdown=e=>{let b=s.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*90-45,y=45-(e.clientY-b.top)/b.height*90,d=Math.max(30,Math.hypot(x,y));spinX=x/d;spinY=y/d;drawSpin()};function aimAt(e){if(rolling||finished)return;let b=c.getBoundingClientRect(),x=(e.clientX-b.left)*1000/b.width,y=(e.clientY-b.top)*500/b.height;aim=Math.atan2(y-balls[0].y,x-balls[0].x)}c.onpointermove=aimAt;c.onpointerdown=aimAt;power.oninput=()=>document.querySelector('#pval').textContent=power.value+'%';function fire(){if(rolling||finished)return;let b=balls[0],v=Number(power.value)*9+70;b.vx=Math.cos(aim)*v;b.vy=Math.sin(aim)*v;b.side=spinX;b.follow=spinY;shots++;scratch=false;rolling=true;update()}shoot.onclick=fire;document.querySelector('#reset').onclick=rack;addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();fire()}});
function step(dt){for(let b of balls){if(b.dead)continue;let speed=Math.hypot(b.vx,b.vy);if(speed<2){b.vx=b.vy=0;continue}let turn=b.side*0.18*dt;let vx=b.vx;b.vx-=b.vy*turn;b.vy+=vx*turn;b.side*=Math.exp(-1.5*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;let drag=Math.max(0,1-(0.7+18/speed)*dt);b.vx*=drag;b.vy*=drag;if(pockets.some(([x,y])=>Math.hypot(b.x-x,b.y-y)<23)){b.dead=true;b.vx=b.vy=0;if(b.k==='white')scratch=true;else if(b.k==='black'){finished=true;status.textContent=potted===14?'Black potted — rack won!':'Black potted early — rack lost.'}else potted++;continue}if(b.x<L+R){b.x=L+R;b.vx=Math.abs(b.vx)*.8;b.vy+=b.side*45;b.side*=.5}if(b.x>L+W-R){b.x=L+W-R;b.vx=-Math.abs(b.vx)*.8;b.vy-=b.side*45;b.side*=.5}if(b.y<T+R){b.y=T+R;b.vy=Math.abs(b.vy)*.8;b.vx-=b.side*45;b.side*=.5}if(b.y>T+H-R){b.y=T+H-R;b.vy=-Math.abs(b.vy)*.8;b.vx+=b.side*45;b.side*=.5}}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.dead||b.dead)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>=2*R||d<.001)continue;let nx=dx/d,ny=dy/d,o=(2*R-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;let v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(v<=0)continue;let p=v*.97;a.vx-=p*nx;a.vy-=p*ny;b.vx+=p*nx;b.vy+=p*ny;if(a.k==='white'){a.vx+=nx*p*a.follow*.45;a.vy+=ny*p*a.follow*.45;a.follow*=.2}}}
function draw(){g.clearRect(0,0,1000,500);let wood=g.createLinearGradient(0,0,0,500);wood.addColorStop(0,'#8a5834');wood.addColorStop(.5,'#3d2115');wood.addColorStop(1,'#79502e');g.fillStyle=wood;g.fillRect(0,0,1000,500);for(let i=0;i<70;i++){g.strokeStyle=`rgba(20,9,3,${.04+(i%5)*.015})`;g.beginPath();g.moveTo(0,i*7);g.bezierCurveTo(280,i*7+5,690,i*7-3,1000,i*7);g.stroke()}g.fillStyle='#103f2f';g.fillRect(32,32,936,436);let felt=g.createRadialGradient(480,210,30,500,250,500);felt.addColorStop(0,'#287d54');felt.addColorStop(1,'#155438');g.fillStyle=felt;g.fillRect(L,T,W,H);g.strokeStyle='#ffffff25';g.lineWidth=1;g.beginPath();g.moveTo(270,T);g.lineTo(270,T+H);g.stroke();g.beginPath();g.arc(270,250,75,Math.PI/2,Math.PI*1.5);g.stroke();for(let [x,y] of pockets){g.fillStyle='#a17a4b';g.beginPath();g.arc(x,y,27,0,7);g.fill();g.fillStyle='#090c0b';g.beginPath();g.arc(x,y,23,0,7);g.fill()}for(let x of [160,270,385,615,730,840])for(let y of [19,481]){g.fillStyle='#d8c39b';g.fillRect(x-3,y-3,6,6)}let a=balls[0];if(!rolling&&!finished&&!a.dead){let dx=Math.cos(aim),dy=Math.sin(aim),dist=900;for(let b of balls.slice(1)){if(b.dead)continue;let x=b.x-a.x,y=b.y-a.y,t=x*dx+y*dy,z=x*x+y*y-t*t;if(t>0&&z<4*R*R)dist=Math.min(dist,t-Math.sqrt(4*R*R-z))}if(dx>0)dist=Math.min(dist,(L+W-R-a.x)/dx);if(dx<0)dist=Math.min(dist,(L+R-a.x)/dx);if(dy>0)dist=Math.min(dist,(T+H-R-a.y)/dy);if(dy<0)dist=Math.min(dist,(T+R-a.y)/dy);g.strokeStyle='#ffffff80';g.setLineDash([7,8]);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x+dx*dist,a.y+dy*dist);g.stroke();g.setLineDash([]);g.beginPath();g.arc(a.x+dx*dist,a.y+dy*dist,R,0,7);g.stroke();g.lineCap='round';g.strokeStyle='#c49a61';g.lineWidth=7;g.beginPath();g.moveTo(a.x-dx*25,a.y-dy*25);g.lineTo(a.x-dx*220,a.y-dy*220);g.stroke();g.strokeStyle='#39271a';g.lineWidth=10;g.beginPath();g.moveTo(a.x-dx*150,a.y-dy*150);g.lineTo(a.x-dx*220,a.y-dy*220);g.stroke();g.lineWidth=1}for(let b of balls){if(b.dead)continue;g.fillStyle='#0005';g.beginPath();g.ellipse(b.x+3,b.y+4,R+2,R*.8,0,0,7);g.fill();let gr=g.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,R);gr.addColorStop(0,b.k==='white'?'#fff':b.k==='black'?'#777':b.k==='red'?'#ff8b79':'#fff2a0');gr.addColorStop(.4,colors[b.k]);gr.addColorStop(1,b.k==='white'?'#a9a48e':'#272019');g.fillStyle=gr;g.beginPath();g.arc(b.x,b.y,R,0,7);g.fill();if(b.k==='black'){g.fillStyle='white';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill();g.fillStyle='black';g.font='8px sans-serif';g.textAlign='center';g.fillText('8',b.x,b.y+3)}}}
let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(rolling){for(let i=0;i<8;i++)step(dt/8);if(!balls.some(b=>!b.dead&&Math.hypot(b.vx,b.vy)>2)){rolling=false;if(balls[0].dead){let x=270,y=250;while(balls.some(b=>!b.dead&&Math.hypot(b.x-x,b.y-y)<2*R+2)){y+=25;if(y>420){y=80;x+=25}}Object.assign(balls[0],ball(x,y,'white'))}update();if(finished){window.evoriumGameScore?.(potted+1);status.textContent=potted===14?'Rack won!':'Black potted early — rack lost.'}}}draw();requestAnimationFrame(loop)}rack();requestAnimationFrame(loop);
</script></body></html>
