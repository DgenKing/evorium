<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crooked Billet Darts</title><style>body{margin:0;background:radial-gradient(ellipse at top,#493329,#15100e 75%);color:#f2dfbf;font:16px system-ui;text-align:center}h1{font-family:Georgia;letter-spacing:3px;margin:18px 0 4px}canvas{width:min(90vw,550px);height:auto;touch-action:none;cursor:crosshair;display:block;margin:auto;filter:drop-shadow(0 12px 18px #0009)}button,select{background:#34251d;color:#f2dfbf;border:1px solid #af9060;border-radius:7px;padding:10px 16px;font:inherit}#hud{display:flex;justify-content:center;gap:32px;margin:15px}strong{font-size:28px;display:block}#msg{min-height:28px;margin:8px}p{color:#bfae97;font-size:13px}#throws{min-height:24px}</style><style>canvas{width:min(90vw,550px,70dvh)}</style>
</head><body><h1>THE CROOKED BILLET</h1><div>EVORIUM • PUB DARTS</div><div id="hud"><div>REMAINING<strong id="score">501</strong></div><div>ROUND<strong id="round">1</strong></div><div>DARTS<strong id="left">3</strong></div></div><canvas id="board" width="640" height="640"></canvas><div id="msg">Aim at the board and click to throw.</div><div id="throws"></div><button id="fire">Throw dart (Space)</button> <button id="reset">New game</button> <select id="difficulty"><option value="1">Normal drift</option><option value="1.7">Hard drift</option><option value=".45">Easy drift</option></select><p>Move your mouse or touch to aim. The moving crosshair shows where the dart will land. Double out to win.</p><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),N=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],C=320,R=246,TAU=Math.PI*2;let aim={x:320,y:190},actual={...aim},score=501,round=1,left=3,start=501,hits=[],turn=[],busy=false,won=false,flight=null;const $=id=>document.getElementById(id);function ring(a,b,lo,hi,color){g.beginPath();g.arc(C,C,hi,a,b);g.arc(C,C,lo,b,a,true);g.closePath();g.fillStyle=color;g.fill();g.strokeStyle='#a6a49a';g.lineWidth=1.3;g.stroke()}
function draw(t){g.clearRect(0,0,640,640);g.save();g.shadowBlur=24;g.shadowColor='#000';g.beginPath();g.arc(C,C,306,0,TAU);g.fillStyle='#171716';g.fill();g.restore();g.beginPath();g.arc(C,C,296,0,TAU);g.strokeStyle='#7a6550';g.lineWidth=4;g.stroke();for(let i=0;i<20;i++){let a=-Math.PI/2+(i-.5)*TAU/20,b=a+TAU/20,m=(a+b)/2,base=i%2?'#d8c9a6':'#282a26',col=i%2?'#356e4a':'#a32e32';ring(a,b,0,R*99/170,base);ring(a,b,R*99/170,R*107/170,col);ring(a,b,R*107/170,R*162/170,base);ring(a,b,R*162/170,R,col);g.fillStyle='#eee4d1';g.font='bold 24px Georgia';g.textAlign='center';g.textBaseline='middle';g.fillText(N[i],C+Math.cos(m)*273,C+Math.sin(m)*273)}for(let [r,col] of [[R*15.9/170,'#34734b'],[R*6.35/170,'#ae3436']]){g.beginPath();g.arc(C,C,r,0,TAU);g.fillStyle=col;g.fill();g.strokeStyle='#bbb7a7';g.lineWidth=1.5;g.stroke()}for(const h of hits)dart(h.x,h.y);let d=Number($('difficulty').value);actual={x:aim.x+d*(Math.sin(t*.0031)*18+Math.sin(t*.0082)*7),y:aim.y+d*(Math.cos(t*.0027)*22+Math.sin(t*.0061)*8)};if(flight){let p=Math.min(1,(t-flight.t)/330);dart(flight.x+(1-p)*110,flight.y+(1-p)*170,1.1+(1-p)*1.6);if(p>=1){let f=flight;flight=null;land(f)}}if(!busy&&!won){g.strokeStyle='#f6cc62';g.lineWidth=2;g.beginPath();g.arc(actual.x,actual.y,11,0,TAU);g.moveTo(actual.x-17,actual.y);g.lineTo(actual.x-5,actual.y);g.moveTo(actual.x+5,actual.y);g.lineTo(actual.x+17,actual.y);g.moveTo(actual.x,actual.y-17);g.lineTo(actual.x,actual.y-5);g.moveTo(actual.x,actual.y+5);g.lineTo(actual.x,actual.y+17);g.stroke()}requestAnimationFrame(draw)}
function dart(x,y,s=1){g.save();g.translate(x,y);g.rotate(-.62);g.scale(s,s);g.strokeStyle='#111';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(0,49);g.stroke();g.strokeStyle='#c4b9a5';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,45);g.stroke();g.fillStyle='#a93832';g.beginPath();g.moveTo(0,30);g.lineTo(-10,53);g.lineTo(0,48);g.lineTo(10,53);g.closePath();g.fill();g.restore()}
function value(x,y){let dx=x-C,dy=y-C,r=Math.hypot(dx,dy)/R*170;if(r>170)return [0,'Miss',false];if(r<=6.35)return [50,'Bull',true];if(r<=15.9)return [25,'Outer bull',false];let i=Math.floor(((Math.atan2(dy,dx)+Math.PI/2+TAU/40+TAU)%TAU)/(TAU/20)),n=N[i];if(r>=162)return [n*2,'D'+n,true];if(r>=99&&r<=107)return [n*3,'T'+n,false];return [n,''+n,false]}
function update(){ $('score').textContent=score;$('round').textContent=round;$('left').textContent=left;$('throws').textContent=turn.join('  •  ')}function fire(){if(busy||won)return;busy=true;flight={...actual,t:performance.now()};}function land(f){hits.push(f);let [v,label,dbl]=value(f.x,f.y);turn.push(label+' ('+v+')');left--;let next=score-v;if(next===0&&dbl){score=0;won=true;window.evoriumGameScore?.(hits.length);$('msg').textContent='CHECKOUT! You won in round '+round;update();return}let bust=next<0||next===1||(next===0&&!dbl);if(bust){score=start;left=0;$('msg').textContent='Bust! Score restored.'}else{score=next;$('msg').textContent=label+' — '+v+' points'}update();if(left===0){setTimeout(()=>{round++;left=3;start=score;hits=[];turn=[];busy=false;update();$('msg').textContent='Next visit — three darts.'},1300)}else busy=false}
function position(e){let b=c.getBoundingClientRect();aim={x:(e.clientX-b.left)*640/b.width,y:(e.clientY-b.top)*640/b.height}}c.addEventListener('pointermove',position);c.addEventListener('pointerdown',e=>{position(e);if(e.pointerType==='touch'){c.setPointerCapture(e.pointerId)}else fire()});c.addEventListener('pointerup',e=>{if(e.pointerType==='touch')fire()});$('fire').onclick=fire;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}});$('reset').onclick=()=>location.reload();requestAnimationFrame(draw);
</script></body></html>
