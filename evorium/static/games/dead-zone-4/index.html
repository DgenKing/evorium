<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080a">
<title>Dead Zone 4.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06080a;color:#e9e4da;font:600 14px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;cursor:none}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000,0 0 8px #000a}
#top{top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{font-size:11px;letter-spacing:2px;color:#9aa3a6}
.big{font-size:22px;letter-spacing:1px}
#wave .big{color:#f6b44a}
#score{text-align:right}
#msg{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:clamp(22px,5vw,44px);letter-spacing:6px;color:#ffcf8a;opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 18px #ff6a0080,0 2px 4px #000}
#msg small{display:block;font-size:.4em;letter-spacing:4px;color:#c9c2b4;margin-top:6px}
#pop{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:18px;letter-spacing:4px;color:#ff4d3a;opacity:0;pointer-events:none;text-shadow:0 2px 6px #000}
#hp{left:12px;bottom:calc(74px + env(safe-area-inset-bottom));width:min(42vw,220px)}
#hpbar{height:10px;background:#0009;border:1px solid #ffffff30;border-radius:2px;margin-top:4px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#b3241a,#e8553c);transition:width .2s}
#ammo{right:12px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:right}
#ammo .big{font-size:34px}
#ammo .res{color:#9aa3a6;font-size:14px}
#bar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end}
#guns{display:flex;gap:5px;flex:1;min-width:0}
button{font:inherit;color:#e9e4da;background:#11161ae6;border:1px solid #ffffff2a;border-radius:8px;padding:0;cursor:pointer;touch-action:manipulation}
#guns button{flex:1;min-width:0;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;letter-spacing:1px;color:#b8b2a6}
#guns button b{font-size:15px;color:#e9e4da}
#guns button.on{border-color:#f6b44a;background:#3b2914e6;color:#f6b44a;box-shadow:0 0 12px #f6b44a40 inset}
#rl{width:66px;height:66px;border-radius:50%;font-size:11px;letter-spacing:1px;border:2px solid #f6b44a99;background:#1a1208e6;position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom))}
#pause{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:38px;height:34px;font-size:13px;opacity:.8}
#scr{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#0000 0%,#000b 70%);padding:24px}
#scr h1{font:900 clamp(46px,12vw,110px)/.9 Impact,"Arial Black",system-ui;letter-spacing:6px;margin:0;color:#e8e1d3;text-shadow:0 0 30px #a0140a90,0 4px 0 #3a0905,0 8px 18px #000}
#scr h1 span{color:#c4271a}
#scr p{color:#c9c2b4;max-width:520px;margin:14px auto;line-height:1.5;font-weight:500}
#scr .go{margin-top:12px;padding:16px 34px;font-size:18px;letter-spacing:4px;border:2px solid #f6b44a;background:#3b2914;color:#ffd08a;border-radius:4px;box-shadow:0 0 24px #f6b44a40}
#scr .sub{font-size:12px;color:#8d8a83;letter-spacing:2px}
#shop{position:fixed;left:50%;top:50%;transform:translate(-50%,-30%);display:none;flex-direction:column;gap:8px;width:min(86vw,340px);background:#0b0f12ee;border:1px solid #f6b44a55;border-radius:10px;padding:16px;box-shadow:0 10px 40px #000}
#shop h3{margin:0 0 4px;letter-spacing:4px;color:#f6b44a;font-size:16px;text-align:center}
#shop .row{padding:13px;text-align:left;display:flex;justify-content:space-between;font-size:14px}
#shop .row:disabled{opacity:.4}
#shop .t{text-align:center;color:#9aa3a6;font-size:12px;letter-spacing:2px}
body.menu .hud,body.menu #bar,body.menu #rl,body.menu #pause{display:none}
#loading{position:fixed;inset:0;display:grid;place-content:center;letter-spacing:6px;color:#9aa3a6;background:#06080a}
@media (min-width:900px){#guns{flex:0 0 520px}}
</style>
</head>

<script>
'use strict';
// ================= DEAD ZONE 4.0 =================
const $=s=>document.querySelector(s);
const cv=$('#c');let g=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.random()*a.length|0], ease=t=>t*t*(3-2*t);
let W=0,H=0,DPR=1;

// ---------- world / camera ----------
const BGW=1672,BGH=941,VPX=893,VPY=500,FOC=600,CAMH=1.6,FOG=[98,102,106];
let S=1,OX=0,OY=0,camX=0,camY=0,shake=0,shX=0,shY=0;
function layout(){
  S=Math.max(W/BGW,H/BGH)*1.06;
  OX=clamp(W*.5-VPX*S,W-BGW*S,0);
  OY=clamp(H*.47-VPY*S,H-BGH*S,0);
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.75);
  W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;layout();
}
addEventListener('resize',resize);resize();
// project world point (x lateral m, y height m, z depth m) → screen
function P(x,y,z){const k=S*FOC/z;return{x:OX+S*VPX+x*k,y:OY+S*VPY+(CAMH-y)*k,k}}
function groundAt(sx,sy){ // screen → ground point
  const dy=sy-(OY+S*VPY);let z=dy>2?S*FOC*CAMH/dy:60;z=clamp(z,1.5,60);
  return{x:(sx-OX-S*VPX)*z/(S*FOC),z};
}

// ---------- assets ----------
function loadImg(src){return new Promise(r=>{const i=new Image;i.onload=()=>r(i);i.onerror=()=>r(i);i.src=src})}
const SPR=[];let BG,RIFLE,ready=false;
const SPRDEF=[{key:'z1',head:[.64,.19,.125],hip:.56,headB:.34},{key:'z2',head:[.40,.11,.08],hip:.52,headB:.22}];
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function prepSprite(img,def){
  const th=Math.min(img.naturalHeight,560),tw=Math.round(img.naturalWidth*th/img.naturalHeight);
  const base=mkCanvas(tw,th),bx=base.getContext('2d');bx.drawImage(img,0,0,tw,th);
  const src=bx.getImageData(0,0,tw,th),d=src.data;
  const variant=fn=>{const c=mkCanvas(tw,th),x=c.getContext('2d'),o=x.createImageData(tw,th),od=o.data;
    for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2],gr=.3*r+.59*gg+.11*b;const q=fn(r,gg,b,gr);od[i]=q[0];od[i+1]=q[1];od[i+2]=q[2];od[i+3]=d[i+3]}
    x.putImageData(o,0,0);return c};
  const tints=[
    variant((r,gg,b)=>[r*.9,gg*.92,b*.98]),                                    // normal, cooled for night
    variant((r,gg,b,gr)=>[lerp(gr,r,.6)*.86,lerp(gr,gg,.6)*.9,lerp(gr,b,.6)*.8]), // sickly
    variant((r,gg,b,gr)=>[lerp(gr,r,.45)*.72,lerp(gr,gg,.45)*.7,lerp(gr,b,.45)*.72]),     // charred / armoured
  ];
  const fog=variant(()=>FOG),white=variant(()=>[255,236,220]),dark=variant(()=>[8,6,6]);
  // alpha mask for pixel-accurate hits
  const mw=48,mh=Math.round(48*th/tw),mc=mkCanvas(mw,mh),mx=mc.getContext('2d');mx.drawImage(base,0,0,mw,mh);
  const md=mx.getImageData(0,0,mw,mh).data,mask=new Uint8Array(mw*mh);for(let i=0;i<mw*mh;i++)mask[i]=md[i*4+3];
  return{tints,fog,white,dark,w:tw,h:th,aspect:tw/th,mask,mw,mh,...def};
}
Promise.all([loadImg(IMG.bg),loadImg(IMG.z1),loadImg(IMG.z2),loadImg(IMG.rifle)]).then(([bg,z1,z2,rf])=>{
  BG=bg;RIFLE=rf;SPR.push(prepSprite(z1,SPRDEF[0]),prepSprite(z2,SPRDEF[1]));
  makeTextures();ready=true;$('#loading').style.display='none';
});

// ---------- procedural textures ----------
let fogTex,grainTex=[],grainPat=[],SPLATS=[],LENS=[],SCORCH=null;
function splatTex(n,dark,soft){
  const c=mkCanvas(256,256),x=c.getContext('2d');x.translate(128,128);
  const blob=(bx,by,r,a)=>{const gr=x.createRadialGradient(bx,by,0,bx,by,r);gr.addColorStop(0,`rgba(${dark?'70,2,2':'105,6,4'},${a})`);gr.addColorStop(.75,`rgba(${dark?'50,0,0':'80,3,2'},${a*.9})`);gr.addColorStop(1,`rgba(40,0,0,0)`);x.fillStyle=gr;x.beginPath();x.arc(bx,by,r,0,7);x.fill()};
  for(let i=0;i<n;i++){const a=Math.random()*7,d=Math.pow(Math.random(),1.6)*90,r=rnd(8,34)*(1-d/140);blob(Math.cos(a)*d,Math.sin(a)*d,r,rnd(.6,.95))}
  for(let i=0;i<n*1.5;i++){const a=Math.random()*7,d=rnd(60,120);blob(Math.cos(a)*d,Math.sin(a)*d,rnd(1.5,5),.9)}
  if(soft){x.globalCompositeOperation='destination-in';const gr=x.createRadialGradient(0,0,40,0,0,128);gr.addColorStop(0,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(-128,-128,256,256)}
  // wet highlight
  x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,190,170,.08)';x.beginPath();x.ellipse(-20,-25,40,20,-.5,0,7);x.fill();
  return c;
}
function makeGibs(sp){
  const pieces=[[.3,0,.45,.3],[.15,.28,.7,.32],[0,.25,.3,.4],[.7,.25,.3,.4],[.15,.6,.35,.4],[.5,.6,.35,.4]];
  sp.gibs=pieces.map(([u,v,w,h])=>{
    const sw=Math.max(8,w*sp.w|0),sh=Math.max(8,h*sp.h|0),c=mkCanvas(sw,sh),x=c.getContext('2d');
    const pts=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=rnd(.32,.5);pts.push([sw/2+Math.cos(a)*sw*r,sh/2+Math.sin(a)*sh*r])}
    x.beginPath();pts.forEach(([px,py],i)=>i?x.lineTo(px,py):x.moveTo(px,py));x.closePath();x.save();x.clip();
    x.drawImage(sp.tints[0],u*sp.w,v*sp.h,sw,sh,0,0,sw,sh);x.restore();
    x.strokeStyle='#5a0604';x.lineWidth=Math.max(3,sw*.06);x.lineJoin='round';x.stroke();
    x.globalCompositeOperation='destination-in';x.fill();
    return{c,u,v,w,h};
  });
}
function makeTextures(){
  for(let i=0;i<5;i++)SPLATS.push(splatTex(10,i%2,true));
  for(let i=0;i<5;i++)LENS.push(splatTex(7,i%2,false));

function spring(e,k,kk,dd,dt){const v=k+'V';e[v]+=((e[k+'T']||0)-e[k])*kk*dt-e[v]*dd*dt;e[k]+=e[v]*dt}

  const sideSign=e.flip?-1:1;
  const lateral=(dt,spd=1.2)=>{
    const prog=clamp(1-(e.z-e.atkZ)/Math.max(1,e.z0-e.atkZ),0,1);
    const tx=lerp(e.x0,e.ax,ease(prog))+Math.sin(e.age*.45+e.seed)*e.wander*(1-prog);
    e.x+=(tx-e.x)*Math.min(1,dt*spd);
  };
  switch(e.state){
  case'walk':{
    e.phase+=dt*e.gait;
    const s=e.phase*2,idx=Math.floor(s)&1,f=s-Math.floor(s);
    let surge=Math.sin(Math.PI*f);surge*=surge;
    let sp;
    if(e.type==='runner'){sp=e.speed*(.78+.44*surge);e.leanT=Math.sin(e.phase*Math.PI*2)*.05+Math.sin(e.age*7+e.seed)*.02}
    else{sp=e.speed*(.22+1.55*surge*(idx?1-e.limp*.75:1));e.leanT=(idx?1:-1)*(.025+e.limp*.07)*sideSign+Math.sin(e.age*.6+e.seed)*.035}
    e.bob=Math.abs(Math.sin(Math.PI*f))*e.T.bob*(idx?1-e.limp*.6:1);
    e.step=Math.sin(e.phase*Math.PI*2)*(e.type==='runner'?.07:.035);

    if(e.type==='boss'&&f<e.lastF&&live){SFX.stomp(e.z);if(e.z<18)shake=Math.max(shake,.25)}

    e.phase+=dt*e.gait;const f=e.phase%1;const pull=f<.45?Math.sin(Math.PI*f/.45):0;

  case'rise':{

// keep them from stacking into each other
function separate(dt){
  for(let i=0;i<Z.length;i++){const a=Z[i];if(a.state==='dying'||a.state==='corpse'||a.state==='lying')continue;
    for(let j=i+1;j<Z.length;j++){const b=Z[j];if(b.state==='dying'||b.state==='corpse'||b.state==='lying')continue;
      const dz=a.z-b.z,dx=a.x-b.x,mz=.9,mx=.75*(a.size+b.size)/2;
      if(Math.abs(dz)<mz&&Math.abs(dx)<mx){const push=(mx-Math.abs(dx))*dt*3*(dx<0?-1:1)||.01;a.x+=push;b.x-=push;
        if(a.state==='walk'&&b.state==='walk'){if(dz>0)a.z+=(mz-dz)*dt*.8;else b.z+=(mz+dz)*dt*.8}}}}

  live=false;scoping=false;held=false;hp=0;
  if(wave>best){best=wave;try{localStorage.setItem('dz4best',best)}catch(e){}}
  setTimeout(()=>{$('#scr h1').innerHTML='YOU<span> DIED</span>';$('#intro').innerHTML=`Survived to wave ${wave} · ${kills} kills · £${credits}`;
    $('#best').textContent='BEST: WAVE '+best;$('#go').textContent='TRY AGAIN';$('#scr').style.display='grid';document.body.classList.add('menu');$('#shop').style.display='none'},1400);
}
function openShop(){
  phase='shop';phaseT=10;hp=Math.min(100,hp+15);$('#shop').style.display='flex';banner('WAVE '+wave+' CLEARED','+15 HP');
  updShop();
}
function updShop(){const c=100+level*60;$('#pDmg').textContent='£'+c;$('#bDmg').disabled=credits<c;$('#bMed').disabled=credits<75||hp>=100}
$('#bDmg').onclick=()=>{const c=100+level*60;if(credits>=c){credits-=c;level++;SFX.ui();updShop()}};
$('#bMed').onclick=()=>{if(credits>=75&&hp<100){credits-=75;hp=Math.min(100,hp+40);SFX.ui();updShop()}};
$('#bGo').onclick=()=>{SFX.ui();startWave()};
$('#go').onclick=newGame;
$('#rl').onclick=()=>{initAudio();startReload()};
$('#pause').onclick=()=>{if(!live)return;paused=!paused;$('#pause').textContent=paused?'▶':'II';if(paused)flashMsg('PAUSED');else $('#msg').style.opacity=0};
document.querySelectorAll('#guns button').forEach(b=>b.onclick=()=>{initAudio();switchGun(+b.dataset.g)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&live&&!paused){paused=true;$('#pause').textContent='▶'}});

// ---------- input ----------
function aimAt(e){ax=clamp(e.clientX/W,0,1);ay=clamp(e.clientY/H,0,1)}
cv.addEventListener('pointerdown',e=>{initAudio();aimAt(e);ptrType=e.pointerType;held=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(!live||paused)return;if(weapon===2&&rt<=0&&ammo>0)scoping=true;else fire()});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||held)aimAt(e)});
const up=()=>{held=false;if(scoping){scoping=false;fire()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{held=false;scoping=false});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')startReload();if('12345'.includes(e.key))switchGun(+e.key-1);if(e.key==='p'||e.key==='Escape')$('#pause').onclick()});
cv.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- main loop ----------
function update(dt){
  t+=dt;
  // timers
  cd=Math.max(0,cd-dt);flash=Math.max(0,flash-dt*9);recoil=Math.max(0,recoil-dt*7);swAnim=Math.max(0,swAnim-dt*3.5);
  hitMark=Math.max(0,hitMark-dt*4);hurtV=Math.max(0,hurtV-dt*1.6);explLight=Math.max(0,explLight-dt*3);
  shake=Math.max(0,shake-dt*1.8);const sk=shake*shake*28;shX=(Math.random()-.5)*sk;shY=(Math.random()-.5)*sk;
  if(msgT>0&&(msgT-=dt)<=0)$('#msg').style.opacity=0;
  if(popT>0&&(popT-=dt)<=0)$('#pop').style.opacity=0;
  // lightning
  nextBolt-=dt;if(nextBolt<=0){nextBolt=rnd(9,22);lightning=1;SFX.thunder(rnd(.4,1.6));setTimeout(()=>lightning=.8,130);setTimeout(()=>lightning=.5,260)}
  lightning=Math.max(0,lightning-dt*4);
  // viewmodel sway follows aim
  const{gw,gh}=gunBox();const tx=(ax-.5)*W*.14,ty=(ay-.5)*gh*.12;vmx+=(tx-vmx)*Math.min(1,dt*7);vmy+=(ty-vmy)*Math.min(1,dt*7);
  camX+=((.5-ax)*W*.018-camX)*Math.min(1,dt*3);camY+=((.5-ay)*H*.012-camY)*Math.min(1,dt*3);
  if(live){
    if(rt>0&&(rt-=dt)<=0){rt=0;ammo=GUNS[weapon].cap;flashMsg('READY')}
    if(held&&GUNS[weapon].auto&&!scoping)fire();
    if(phase==='intro'){phaseT-=dt;if(phaseT<=0)startWave()}
    else if(phase==='wave'){
      spawnT-=dt;
      if(toSpawn>0&&spawnT<=0){spawn(waveMix());toSpawn--;spawnT=Math.max(.45,2-wave*.1)*rnd(.6,1.3);
        if(wave>=3&&Math.random()<.2&&toSpawn>0){spawn('walker','far');toSpawn--}}
      aliveCount=Z.filter(e=>e.state!=='dying'&&e.state!=='corpse').length;
      if(!toSpawn&&!aliveCount){
        if(wave%5===0&&!bossUp){bossUp=true;const b=spawn('boss','far');b.z=30;b.z0=30;banner('BOSS','IT HEARD THE GUNFIRE');SFX.groan(b,true)}
        else openShop();
      }
    }else if(phase==='shop'){phaseT-=dt;$('#shopt').textContent='NEXT WAVE IN '+Math.ceil(phaseT);if(phaseT<=0)startWave()}
    if(hp<35&&hp>0){beatT-=dt;if(beatT<=0){beatT=.85;SFX.beat()}}
  }else if(ready){ // attract mode: a few shamblers in the fog behind the menu
    if(Z.filter(e=>e.state!=='corpse').length<5&&Math.random()<dt*.6)spawn('walker','far');
    for(const e of Z)if(e.z<14&&e.state==='walk'){e.fade-=dt*.8;if(e.fade<=0)e.dead=true}
  }
  for(const e of Z)updZombie(e,dt);
  separate(dt);
  // corpse cap
  const corpses=Z.filter(e=>e.state==='corpse');if(corpses.length>24){corpses[0].dead=true}
  Z=Z.filter(e=>!e.dead&&!(e.state==='corpse'&&e.st>25));
}
function render(dt){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#06080a';g.fillRect(0,0,W,H);
  g.save();g.translate(shX+camX,shY+camY);
  // overscan so shake/sway never shows an edge
  drawBackground();
  drawRain(dt,false);
  drawDecals(dt);
  const order=[...Z].sort((a,b)=>b.z-a.z);
  for(const e of order)drawZombie(e);
  drawPuffs(dt);drawParticles(dt);drawProjectiles(dt);
  g.restore();
  // ground mist hugging the street
  const mist=g.createLinearGradient(0,OY+S*(VPY-20),0,H);mist.addColorStop(0,'rgba(110,118,124,.16)');mist.addColorStop(.35,'rgba(110,118,124,.04)');mist.addColorStop(1,'rgba(20,24,28,.25)');
  g.fillStyle=mist;g.fillRect(0,0,W,H);
  drawTracers(dt);
  drawScope();
  if(live)drawGun(dt);
  drawShells(dt);
  drawRain(dt,true);
  drawOverlays(dt);
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000||.016);last=now;
  if(ready){if(!paused)update(dt);render(paused?0:dt);hud()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body>
</html>
