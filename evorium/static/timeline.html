<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evorium · Timeline</title>
<style>
body{background:#141414;color:#e8e8e8;font:15px/1.5 system-ui;margin:0 auto;padding:20px;max-width:950px}a{color:#d4a24c}header,nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px}h1 a{text-decoration:none}select{background:#222;color:inherit;padding:8px;border:1px solid #444;border-radius:5px}.day{background:#1e1e1e;padding:20px;border-radius:8px;margin-top:20px}.entry{padding:12px 0;border-top:1px solid #333}.tag{color:#d4a24c;font-size:12px}.director{color:#ba9cfa}.people,time{color:#aaa;font-size:12px}.digest{border-left:3px solid #d4a24c;padding-left:12px}.divider{border-top:2px dashed #d4a24c;color:#d4a24c;padding:10px}#error{color:#e06060}
</style></head><body>
<header><h1><a href="/">EVORIUM</a></h1><span>Timeline</span></header>
<nav><label>Character <select id="character"><option value="">Everyone</option></select></label><label><input type="checkbox" id="important"> Important only</label><label>Kind <select id="kind"><option value="">All</option><option value="action">Actions</option><option value="offer">Offers</option><option value="arc">Story arcs</option></select></label></nav>
<p id="error" role="status"></p><main id="days"></main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let lastVisit=null;
try{lastVisit=localStorage.getItem('evorium.timelineVisit');localStorage.setItem('evorium.timelineVisit',new Date().toISOString());}catch(e){}
async function load(){
 try{
  const params=new URLSearchParams({min_importance:$('important').checked?'3':'1'});
  if($('kind').value)params.set('kind',$('kind').value);
  if($('character').value)params.set('agent_id',$('character').value);
  const response=await fetch('/timeline?'+params);if(!response.ok)throw Error('Could not load the timeline.');
  const data=await response.json();let divided=false;
  $('days').innerHTML=data.days.map(day=>`<section class="day"><h2>${esc(day.label)}</h2>${day.digest?`<p class="digest">${esc(day.digest)}</p>`:''}${day.entries.map(e=>{
   let divider='';if(lastVisit&&!divided&&e.created_at<=lastVisit){divider='<div class="divider">Since your last visit ↑</div>';divided=true;}
   return `${divider}<article class="entry"><time>${esc(e.sim_at.slice(11))}</time> <span class="tag ${e.kind==='director'?'director':''}">${esc(e.kind.replaceAll('_',' '))}</span><div>${esc(e.text)}</div><div class="people">${[e.agent_name,e.other_name].filter(Boolean).map(esc).join(' · ')}</div></article>`;
  }).join('')}</section>`).join('')||'<p>No events match these filters yet.</p>';
 }catch(e){$('error').textContent=e.message;}
}
fetch('/agents').then(r=>r.json()).then(list=>{$('character').innerHTML+=list.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');}).catch(()=>{});
$('kind').onchange=load;$('character').onchange=load;$('important').onchange=load;load();setInterval(load,5000);
</script></body></html>
