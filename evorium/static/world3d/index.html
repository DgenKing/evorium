<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Evorium · Shuttle Street</title><link rel="stylesheet" href="/static/world3d/css/world3d.css"><script type="importmap">{"imports":{"three":"/static/vendor/three/three.module.min.js","three/addons/":"/static/vendor/three/examples/jsm/"}}</script></head><body>
<canvas id="world" aria-label="Shuttle Street 3D world"></canvas><div id="labels"></div>
<header><a href="/" class="wordmark">EVORIUM</a><span>Shuttle Street, Ancoats</span><button id="settings-button" aria-label="Settings">⚙</button></header>
<div id="loading"><a href="/" class="wordmark">EVORIUM</a><p>The street doesn't stop when you leave.</p><progress id="progress" max="1" value="0"></progress><p id="load-status">Opening Shuttle Street…</p></div>
<div id="connection" role="status" hidden></div><div id="toast" role="status" hidden></div>
<div id="controls">WASD move · Shift run · Space jump · Drag look · E talk</div><div id="portrait-hint">Best explored in landscape</div><div id="talk-hint" hidden></div><button id="jump" class="touch-button">Jump</button><button id="talk" class="touch-button" hidden>Talk</button>
<section id="settings" class="panel" hidden><h2>Street settings</h2><label>Quality <select id="quality"><option>low</option><option>medium</option><option>high</option></select></label><label><input id="tags" type="checkbox" checked> Name tags</label><label><input id="street-life" type="checkbox" checked> Street life</label><label><input id="invert" type="checkbox"> Invert look</label><label>Sensitivity <input id="sensitivity" type="range" min="0.25" max="2" step="0.05" value="1"></label><button id="close-settings">Back to the street</button></section>
<section id="chat" class="panel" hidden><button id="close-chat" class="close" aria-label="End conversation">×</button><h2 id="chat-name"></h2><div id="chat-log" aria-live="polite"></div><form id="chat-form"><label for="message">Say something</label><input id="message" maxlength="500" autocomplete="off" required><button id="send">Send</button></form></section>
<section id="card" class="panel" hidden><button id="close-card" class="close" aria-label="Close character card">×</button><img id="portrait" alt="Character portrait" hidden><h2 id="card-name"></h2><p id="card-detail"></p></section>
<section id="catchup" class="panel" hidden><h2>While you were away</h2><p id="catchup-text"></p><ul id="catchup-items"></ul><button id="dismiss-catchup">Back to the street</button></section>
<section id="profile" class="panel" hidden><h2>What should we call you?</h2><form id="profile-form"><label for="name">Name</label><input id="name" minlength="2" maxlength="30" required><button>Join the street</button></form></section>
<pre id="debug" hidden></pre><script type="module" src="/static/world3d/js/main.js"></script></body></html>
